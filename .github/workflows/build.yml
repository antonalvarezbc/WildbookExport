name: Build

on:
  push:
    branches: [main, release-cross-platform]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  make:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux (.deb / .rpm)
            artifact: wildex-linux
          - os: windows-latest
            name: windows (.exe)
            artifact: wildex-windows
          - os: macos-latest
            name: macos Apple Silicon (.dmg)
            artifact: wildex-macos-arm64
          # An arm64 build does not run on Intel Macs at all, and there is no translation the
          # other way round. macos-15-intel is the last x86_64 image Actions offers (until
          # August 2027); macos-13 was retired in December 2025.
          - os: macos-15-intel
            name: macos Intel (.dmg)
            artifact: wildex-macos-intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # dpkg and fakeroot ship with the runner image, rpmbuild does not
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - run: npm run make

      # Forge's MakerDMG needs appdmg, which cannot be installed here (see forge.config.ts).
      # hdiutil ships with macOS and builds the same drag-to-Applications image.
      - name: Build .dmg
        if: runner.os == 'macOS'
        run: |
          app=$(find out -maxdepth 2 -name 'WildEx.app' -print -quit)
          if [ -z "$app" ]; then echo "No packaged WildEx.app found under out/"; exit 1; fi

          version=$(node -p "require('./package.json').version")
          arch=$(node -p "process.arch")
          staging=$(mktemp -d)/WildEx

          mkdir -p "$staging" out/make/dmg
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create -volname WildEx -srcfolder "$staging" -ov -format UDZO \
            "out/make/dmg/WildEx-${version}-${arch}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  release:
    name: Attach installers to the release
    needs: make
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || echo "Release already exists, uploading assets to it"
          find artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
